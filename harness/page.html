<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:13px monospace;background:#111;color:#eee}
#bar{padding:6px 8px;background:#333;font-weight:bold}
#container{width:100vw;height:330px;overflow:hidden;touch-action:none;position:relative}
#display{width:900px;height:900px;background-color:#1d3a5f;background-image:linear-gradient(#ffffff33 1px,transparent 1px),linear-gradient(90deg,#ffffff33 1px,transparent 1px);background-size:50px 50px}
#kbd{width:95%;height:28px;margin:6px}
#log{white-space:pre;height:330px;overflow:hidden;padding:6px;background:#000;color:#9f9}</style></head>
<body><div id="bar">Harness: <span id="label"></span></div><div id="container"><div id="display"></div></div>
<textarea id="kbd" placeholder="soft keyboard textarea"></textarea><div id="log"></div>
<script src="bundle.js"></script></body></html>
